# 软著配置文件 - 测试用
# 使用 test-copyright-repo 仓库模拟两个软著

snapshot:
  repository: test-copyright-repo
  created_at: "2026-07-22"

policies:
  path_overlap: forbidden
  exact_content_overlap: forbidden
  copied_code_detection: enabled
  unallocated_file_access: forbidden
  shared_file_policy: excluded
  generated_code_policy: excluded
  third_party_code_policy: excluded

# 团队成员（用于代码归属分析）
# 基于 git blame 邮箱地址判别
team:
  - name: 邱世乐
    email: qiushile@example.com
    role: lead
  - name: 开发者A
    email: dev-a@example.com
    role: developer

copyrights:
  # description 会直接作为《软件的主要功能》，去除空白后必须为500至1300字。
  # 必须按真实系统填写；不能使用通用模板、重复段落或占位内容凑字数。
  - id: collector
    name: 实时数据采集与传输系统
    version: V1.0
    description: ""
    description_status: required_manual_input_500_to_1300_characters
    include_paths:
      - services/collector/**
      - libs/protocol-common/**
    exclude_paths:
      - services/parser/**
      - shared/**
      - tests/**

  - id: parser
    name: 数据解析与标准化处理系统
    version: V1.0
    description: ""
    description_status: required_manual_input_500_to_1300_characters
    include_paths:
      - services/parser/**
    exclude_paths:
      - services/collector/**
      - shared/**
      - tests/**
